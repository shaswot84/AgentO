<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — AgentO Security Store</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <header class="navbar">
      <div class="brand">
        <a href="/">🛡️ <strong>AgentO Security Store</strong></a>
      </div>
      <nav class="nav-links">
        <a href="/">Catalog</a>
        <a href="/orders.html">Orders</a>
        <a href="/profile.html" class="active">Profile</a>
        <a href="/admin.html">Admin</a>
      </nav>
      <div id="user-status-container"></div>
    </header>

    <div id="security-banner-container"></div>

    <div style="max-width: 600px; margin: 20px auto;" class="content-box">
      <h2>User Profile (/api/profile)</h2>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">
        Manage your profile attributes and view session state.
      </p>

      <div id="unauth-warning" class="alert alert-danger" style="display: none;">
        You are not logged in! Please <a href="/login.html" style="color: inherit; text-decoration: underline;">log in</a> to view this profile.
      </div>

      <div id="profile-container" style="display: none;">
        <form id="profile-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="prof-username" class="form-input" disabled>
          </div>
          <div class="form-group">
            <label>Role</label>
            <input type="text" id="prof-role" class="form-input" disabled>
          </div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="prof-fullname" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="prof-email" class="form-input" required>
          </div>
          <button type="submit" class="btn btn-primary">Save Profile Changes</button>
        </form>

        <div id="cookie-status-display" class="test-panel"></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function loadProfile() {
      try {
        const res = await fetch('/api/profile');
        if (res.status === 401) {
          document.getElementById('unauth-warning').style.display = 'block';
          return;
        }
        const user = await res.json();
        document.getElementById('profile-container').style.display = 'block';
        document.getElementById('prof-username').value = user.username;
        document.getElementById('prof-role').value = user.role;
        document.getElementById('prof-fullname').value = user.fullName;
        document.getElementById('prof-email').value = user.email;
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('prof-fullname').value;
      const email = document.getElementById('prof-email').value;

      try {
        const res = await fetch('/api/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email })
        });
        const data = await res.json();
        if (res.ok) {
          alert('Profile successfully updated');
          checkAuth();
        } else {
          alert(`Error: ${data.error}`);
        }
      } catch (err) {
        alert('Failed to update profile');
      }
    });

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
